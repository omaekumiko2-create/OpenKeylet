<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenKeylet · Passkey</title>
    <script src="ui-core.js"></script>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="request-page">
    <div class="app-frame">
      <header class="titlebar">
        <div class="app-mark">
          <span class="app-mark-symbol" aria-hidden="true">
            <svg class="app-mark-logo" viewBox="0 0 400 400" aria-hidden="true">
              <path class="logo-ring" fill-rule="evenodd" d="M24 8H276A16 16 0 0 1 292 24V276A16 16 0 0 1 276 292H24A16 16 0 0 1 8 276V24A16 16 0 0 1 24 8ZM124 108H176A16 16 0 0 1 192 124V176A16 16 0 0 1 176 192H124A16 16 0 0 1 108 176V124A16 16 0 0 1 124 108Z" />
              <path class="logo-bit" d="M324 208H376A16 16 0 0 1 392 224V376A16 16 0 0 1 376 392H224A16 16 0 0 1 208 376V324A16 16 0 0 1 224 308H292A16 16 0 0 0 308 292V224A16 16 0 0 1 324 208Z" />
            </svg>
          </span>
          <strong class="app-mark-wordmark"><span class="brand-open">Open</span><span class="brand-keylet">Keylet</span></strong>
        </div>

        <div class="title-tools">
          <button class="title-switch" id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Light mode" title="Switch to light mode">
            <span class="title-switch-option" data-state="false" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 12A8 8 0 1 1 12 4A6 6 0 0 0 20 12Z" /></svg>
            </span>
            <span class="title-switch-option" data-state="true" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" /></svg>
            </span>
          </button>
        </div>
      </header>

      <main class="main-scroll">
        <section class="request-card">
          <div class="request-head">
            <div class="lock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2" /><path d="M3.5 18.5a5.5 5.5 0 0 1 9.8-3.4M15.5 13.5a2.5 2.5 0 1 1 3.8 2.1L16 19h3.5" /></svg>
            </div>
            <div>
              <span class="panel-code" data-i18n="passkey.subtitle">PASSKEY</span>
              <h1 id="title">Passkey</h1>
            </div>
          </div>

          <p class="source-pill" id="origin"></p>
          <p id="account" class="request-account"></p>

          <form id="request-form" autocomplete="off">
            <label class="field-label" for="credential" data-i18n="passkey.account">Account</label>
            <select id="credential" class="input"></select>

            <div id="pin-panel" hidden>
              <label class="field-label" for="pin" data-i18n="unlock.pinLabel">6-digit PIN</label>
              <input id="pin" class="input pin-input" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="••••••" autocomplete="off" />
            </div>

            <p id="note" class="request-note"></p>

            <div class="request-actions">
              <button id="confirm" class="button primary full-btn" type="submit" data-i18n="passkey.confirm">Confirm</button>
              <button id="fallback" class="button secondary full-btn" type="button" data-i18n="passkey.fallback">Use device or security key</button>
              <button id="cancel" class="button quiet full-btn" type="button" data-i18n="passkey.cancel">Cancel</button>
            </div>
          </form>
        </section>
      </main>

      <p id="error" class="toast" data-tone="error" role="alert"></p>
    </div>

    <script src="request.js"></script>
  </body>
</html>
